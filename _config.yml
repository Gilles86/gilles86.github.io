# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Gilles de Hollander, PhD
email: gilles.de.hollander@gmail.com
description: >- # this means to ignore newlines until "baseurl:"
  Gilles de Hollander is a cognitive neuroscientist in the lab of Christian Ruff
  at the Zurich Center for Neuroeconomics (ZNE), University of Zurich (UZH).
tagline: Cognitive neuroscientist at the University of Zurich
author: Gilles de Hollander
baseurl: "" # the subpath of your site, e.g. /blog
domain: www.gillesdehollander.nl
url: https://www.gillesdehollander.nl # the base hostname & protocol for your site, e.g. http://example.com
twitter_username: GillesdeH
github_username:  Gilles86

# Build settings
# theme: minima
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Portrait as the default social preview; leave the placeholder posts out of the sitemap
defaults:
  - scope:
      path: ""
    values:
      image: /assets/imgs/picture_gilles_2026.jpg
  - scope:
      path: ""
      type: posts
    values:
      sitemap: false
  - scope:
      path: "assets/pdfs/cv_gilles_nov2021.pdf"
    values:
      sitemap: false
  - scope:
      path: "assets/pdfs/cv_gilles_feb2022.pdf"
    values:
      sitemap: false

# Compile sass
sass:
  sass_dir: assets/css
  style: compressed

collections:
  publications:
    output: false
    permalink: /publications/:path/
  projects:
    output: false
    permalink: /projects/:path/

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/
#
# pycortex static viewers (odc_viewer/) keep their data in data/__<hash>_0.png
# files. Jekyll skips files starting with "_" unless they are listed here
# (matched on the file name, not the path).
include:
  - "__*_0.png"

exclude:
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - serve_docker.sh
  - README.md

log_level: info

